<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G2/G3 일정 · 정대영 부사장님</title>
<style>
:root{
  --bg:#F3F2EE; --card:#FFFFFF; --line:#DAD8D1; --line2:#ECEAE4;
  --ink:#1B1F26; --ink2:#4A4E55; --mute:#7A7E85; --teal:#0F766E; --teal2:#E3EFEF; --red:#B3261E;
  --g2t:#0F766E; --g3t:#C2410C; --g2m:#1E40AF; --g3m:#9D174D;
  --g2eBg:#D9ECE9; --g2eTx:#0B5A54; --g3eBg:#F8E3D0; --g3eTx:#8A4A0B;
  --hol:#D9D6CE; --vpc:#1F3A5F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
.main{max-width:1280px;margin:0 auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
/* ---------- 상단 ---------- */
.bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;color:var(--vpc)}
.brand small{font-weight:400;color:var(--mute);font-size:11px;margin-left:6px}
.ibtn{height:34px;min-width:34px;padding:0 11px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--ink)}
.ibtn:hover{background:#F6F5F1}
.ibtn.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.ibtn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.mtitle{font-size:18px;font-weight:700;min-width:110px;text-align:center}
.legend{margin-left:auto;display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:11.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block;flex-shrink:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{height:31px;padding:0 13px;border-radius:16px;border:1.5px solid;background:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;flex-shrink:0;opacity:.45}
.chip.on{opacity:1;color:#fff}
.chip.vp{border-color:var(--vpc);color:var(--vpc)} .chip.vp.on{background:var(--vpc);color:#fff}
.chip.g2{border-color:var(--g2t);color:var(--g2t)} .chip.g2.on{background:var(--g2t);color:#fff}
.chip.g3{border-color:var(--g3t);color:var(--g3t)} .chip.g3.on{background:var(--g3t);color:#fff}
.chip.g2e{border-color:var(--g2eTx);color:var(--g2eTx)} .chip.g2e.on{background:var(--g2eTx);color:#fff}
.chip.g3e{border-color:var(--g3eTx);color:var(--g3eTx)} .chip.g3e.on{background:var(--g3eTx);color:#fff}
.stat{font-size:11px;color:var(--mute);margin-left:auto;white-space:nowrap}
/* ---------- 월간 ---------- */
.month{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#EEEDE8;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink2)}
.dow div{padding:7px 8px}
.dow .sun{color:var(--red)} .dow .sat{color:var(--vpc)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:21px;gap:3px 0;padding:3px 0 6px;border-bottom:1px solid var(--line2);font-size:11.5px;cursor:pointer;min-height:88px;align-content:start}
.week:hover{background:#FAFAF7}
.week.sel{background:var(--teal2);box-shadow:inset 4px 0 0 var(--teal)}
.week .d{padding:0 7px;font-weight:700;display:flex;align-items:center;gap:5px}
.week .d.out{color:#A3A6AB;font-weight:400}
.week .d.sun{color:var(--red)} .week .d.sat{color:var(--vpc)}
.week .d .today{width:21px;height:21px;border-radius:11px;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.week .d .add{margin-left:auto;opacity:0;font-size:14px;color:var(--teal);font-weight:700;padding:0 3px}
.week .d:hover .add{opacity:1}
.ev{margin:0 3px;padding:0 6px;border-radius:4px;line-height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-size:11.5px}
.ev.g2trip{background:var(--g2t);color:#fff} .ev.g3trip{background:var(--g3t);color:#fff}
.ev.g2meet{background:var(--g2m);color:#fff} .ev.g3meet{background:var(--g3m);color:#fff}
.ev.g2event{background:var(--g2eBg);color:var(--g2eTx);border-left:3px solid var(--g2eTx);line-height:19px}
.ev.g3event{background:var(--g3eBg);color:var(--g3eTx);border-left:3px solid var(--g3eTx);line-height:19px}
.ev.holiday{background:var(--hol);color:var(--ink2)}
.ev .m{font-weight:700;margin-right:3px;opacity:.9}
/* ---------- 주간 패널 ---------- */
.wk{background:#fff;border-top:3px solid var(--teal);border-bottom:1px solid var(--line);cursor:default}
.wk .head{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.wk .head .h{font-size:14.5px;font-weight:700;color:var(--vpc)}
.wk .head .r{margin-left:auto;display:flex;gap:5px}
.wk .head .ibtn{height:30px;font-size:12px}
.wkwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wkin{min-width:720px}
.wkgrid{display:grid;grid-template-columns:56px repeat(var(--nd),minmax(0,1fr));font-size:11.5px}
.wkgrid>div{border-left:1px solid var(--line2)}
.wkgrid>div:first-child{border-left:0}
.wkgrid .lab{padding:6px 7px;color:var(--mute);font-weight:700;font-size:10.5px;display:flex;align-items:center}
.rowT{background:#FBFAF7;border-bottom:1px solid var(--line2)}
.rowT>div{padding:6px 5px;display:flex;flex-direction:column;gap:4px;min-height:36px}
.tcard{display:flex;flex-direction:column;gap:2px;padding:6px 8px;background:#FFF6E3;border:1px solid #E7B15A;border-radius:6px;cursor:pointer;font-size:11px}
.tcard.g2trip,.tcard.g2meet{border-color:var(--g2t);background:#EAF4F2}
.tcard.g3trip,.tcard.g3meet{border-color:var(--g3t);background:#FBEFE6}
.tcard b{font-size:11.5px}
.tcard .m{color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap}
.tcard .term{font-weight:700;color:var(--vpc)}
.tcard a{color:var(--teal);text-decoration:none}
.rowH{background:#EEEDE8;border-bottom:1px solid var(--line)}
.rowH>div{padding:6px 6px}
.rowH .dn{font-weight:700;font-size:12px}
.rowH .dn.sun,.rowH .dn.hol{color:var(--red)}
.rowH .dn.today{color:var(--teal)}
.rowH .hn{font-size:10px;color:var(--mute)}
.rowA{border-bottom:1px solid var(--line2)}
.rowA>div{padding:5px 4px;display:flex;flex-direction:column;gap:4px;min-height:34px}
.rowA .ev{margin:0;font-size:11px}
.timegrid{display:grid;grid-template-columns:56px repeat(var(--nd),minmax(0,1fr));grid-template-rows:repeat(var(--nr),15px);font-size:10.5px}
.timegrid .tl{padding:0 7px;color:var(--mute);border-bottom:1px solid #F0EEE8;display:flex;align-items:center;grid-column:1;font-size:10.5px}
.timegrid .tl.h{background:#EEEDE8}
.daycol{border-left:1px solid var(--line2);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(var(--nr),15px);gap:0 2px;padding:0 2px;position:relative}
.daycol.hol{background:#EDEBE4;display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:700;font-size:12.5px}
.daycol.today{background:#F7FBFB}
.daycol .hl{position:absolute;left:0;right:0;border-top:1px solid #F0EEE8;pointer-events:none}
.tev{margin:1px 0;border-radius:4px;padding:3px 5px;line-height:1.3;overflow:hidden;cursor:pointer;font-size:10.5px;z-index:1}
.tev.g2trip{background:var(--g2t);color:#fff} .tev.g3trip{background:var(--g3t);color:#fff}
.tev.g2meet{background:var(--g2m);color:#fff} .tev.g3meet{background:var(--g3m);color:#fff}
.tev.g2event{background:var(--g2eBg);color:var(--g2eTx);border-left:3px solid var(--g2eTx)}
.tev.g3event{background:var(--g3eBg);color:var(--g3eTx);border-left:3px solid var(--g3eTx)}
.rowS{display:grid;grid-template-columns:56px repeat(var(--nd),minmax(0,1fr));grid-auto-rows:23px;gap:3px 0;padding:5px 0;background:#FBFAF7;border-bottom:1px solid var(--line2);font-size:11.5px}
.rowS .lab{grid-column:1;padding:0 7px;color:var(--mute);font-weight:700;font-size:10.5px;display:flex;align-items:center}
.rowS .ev{line-height:21px}
.rowS .ev.g2event,.rowS .ev.g3event{line-height:20px}
.mini{height:21px;padding:0 8px;border:0;border-radius:11px;font-size:10.5px;color:#fff;cursor:pointer;margin:3px 3px 0 0}
.mini.g2m{background:var(--g2m)} .mini.g3m{background:var(--g3m)}
.rowN{border-top:1px solid var(--line);background:#FBFAF7}
.rowN>div{padding:5px;min-height:38px}
.rowN .note{min-height:28px;padding:4px 6px;border-radius:4px;font-size:11.5px;outline:none;line-height:1.4}
.rowN .note:empty:before{content:"더블클릭 입력";color:#B5B8BD}
.rowN .note:focus{background:#fff;box-shadow:0 0 0 2px var(--teal2)}
/* ---------- 전체일정 목록 ---------- */
.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
.list table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
.list th,.list td{padding:8px 9px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
.list th{background:#EEEDE8;font-size:11.5px;color:var(--ink2);position:sticky;top:0}
.list tr.mo td{background:#F6F5F1;font-weight:700;color:var(--vpc);font-size:12.5px}
.list tr.r:hover td{background:#FAFAF7;cursor:pointer}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10.5px;color:#fff}
.pill.g2trip{background:var(--g2t)} .pill.g3trip{background:var(--g3t)}
.pill.g2meet{background:var(--g2m)} .pill.g3meet{background:var(--g3m)}
.pill.g2event{background:var(--g2eBg);color:var(--g2eTx)} .pill.g3event{background:var(--g3eBg);color:var(--g3eTx)}
.pill.holiday{background:var(--hol);color:var(--ink2)}
.vpmark{color:var(--vpc);font-weight:700}
/* ---------- 패널 ---------- */
.ov{position:fixed;inset:0;background:rgba(20,24,30,.45);display:none;align-items:stretch;justify-content:flex-end;z-index:50}
.ov.show{display:flex}
.panel{width:460px;max-width:100%;background:#fff;height:100%;overflow:auto;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.panel .ph{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#fff;z-index:2}
.panel .ph b{font-size:15px;color:var(--vpc)}
.panel .pb{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label,.f .lab{font-size:11px;font-weight:700;color:var(--mute)}
.f input,.f select,.f textarea{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%}
.f textarea{height:80px;padding:8px 10px;resize:vertical}
.g2c{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ck{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.ck input{width:17px;height:17px}
.tgl{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;background:#FFF6E3;border:1px solid #E7B15A;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink);text-align:left}
.tgl .ar{margin-left:auto;transition:.15s}
.tgl.open .ar{transform:rotate(90deg)}
.tbox{display:flex;flex-direction:column;gap:8px;padding:12px;background:#FFFBF2;border:1px solid #E7B15A;border-top:0;border-radius:0 0 8px 8px}
.tbox .f input,.tbox .f select{height:35px}
.tbox .tt{display:flex;gap:4px}
.tbox .tt button{flex-grow:1;height:33px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px}
.tbox .tt button.on{background:var(--vpc);border-color:var(--vpc);color:#fff;font-weight:700}
.att{display:flex;flex-direction:column;gap:4px}
.att a{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:12px;text-decoration:none;color:var(--teal)}
.att a .x{margin-left:auto;color:var(--red);font-weight:700;padding:0 4px}
.panel .pf{margin-top:auto;display:flex;gap:8px;padding:13px 16px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:#fff}
.dbtn{height:40px;padding:0 16px;border:1px solid var(--red);background:#fff;color:var(--red);border-radius:7px;font-size:13px}
.sbtn{height:40px;padding:0 20px;border:0;background:var(--teal);color:#fff;border-radius:7px;font-size:13.5px;font-weight:700}
.cbtn{height:40px;padding:0 16px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:13px}
.hint{font-size:11.5px;color:var(--ink2);line-height:1.5;padding:10px 12px;background:#EEEDE8;border-radius:8px}
.hint code{background:#fff;padding:1px 4px;border-radius:3px;font-size:11px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:640px){
  .main{padding:8px}
  .brand{font-size:15px}
  .brand small{display:none}
  .mtitle{font-size:15.5px;min-width:92px}
  .ibtn{height:32px;padding:0 9px;font-size:12px}
  .legend{grid-template-columns:auto auto;gap:2px 10px;font-size:10.5px;margin-left:0;width:100%}
  .week{font-size:10px;min-height:66px;grid-auto-rows:18px}
  .ev{padding:0 3px;line-height:17px;margin:0 1px;border-radius:3px}
  .ev.g2event,.ev.g3event{line-height:16px}
  .week .d{padding:0 4px;font-size:10.5px}
  .week .d .today{width:18px;height:18px;font-size:10px}
  .panel{width:100%}
}
@media print{.bar,.wk .head .r{display:none}.main{padding:0}}
</style>
</head>
<body>
<div class="main">
  <div class="bar">
    <div class="row">
      <div class="brand">G2/G3 일정<small>정대영 부사장님 · 중화 G2 · 미주 G3</small></div>
      <span style="flex-grow:1"></span>
      <button class="ibtn on" id="navMonth" onclick="setView('month')">월간</button>
      <button class="ibtn" id="navList" onclick="setView('list')">전체일정</button>
      <button class="ibtn" onclick="openSettings()" title="설정 · 클라우드">⚙</button>
      <button class="ibtn primary" onclick="openEvent(null)">+ 추가</button>
    </div>
    <div class="row">
      <button class="ibtn" onclick="moveMonth(-1)">&lt;</button>
      <div class="mtitle" id="mTitle"></div>
      <button class="ibtn" onclick="moveMonth(1)">&gt;</button>
      <button class="ibtn" onclick="goToday()">오늘</button>
      <div class="legend">
        <span><i style="background:var(--g2t)"></i>G2 출장</span><span><i style="background:var(--g3t)"></i>G3 출장</span>
        <span><i style="background:var(--g2m)"></i>G2 회의</span><span><i style="background:var(--g3m)"></i>G3 회의</span>
        <span><i style="background:var(--g2eBg);border-left:3px solid var(--g2eTx)"></i>G2 행사</span><span><i style="background:var(--g3eBg);border-left:3px solid var(--g3eTx)"></i>G3 행사</span>
      </div>
    </div>
    <div class="row">
      <div class="chips">
        <button class="chip vp on" data-f="vp" onclick="toggleF('vp')">★ 정부사장님</button>
        <button class="chip g2 on" data-f="g2" onclick="toggleF('g2')">G2 중화</button>
        <button class="chip g3 on" data-f="g3" onclick="toggleF('g3')">G3 미주</button>
        <button class="chip g2e on" data-f="g2e" onclick="toggleF('g2e')">G2 행사</button>
        <button class="chip g3e on" data-f="g3e" onclick="toggleF('g3e')">G3 행사</button>
      </div>
      <div class="stat" id="hdrStat"></div>
    </div>
  </div>
  <div id="viewMonth"></div>
  <div id="viewList" style="display:none"></div>
</div>

<!-- 일정 편집 -->
<div class="ov" id="ovEvent" onclick="if(event.target===this)closeEvent()">
  <div class="panel">
    <div class="ph"><b id="evTitleH">일정 상세</b><span style="flex-grow:1"></span><button class="ibtn" onclick="closeEvent()">×</button></div>
    <div class="pb">
      <div class="f"><label for="e_title">제목</label><input id="e_title" placeholder="[중국] 상해 Den Tech (10/22-25)"></div>
      <div class="g2c">
        <div class="f"><label for="e_start">시작일</label><input id="e_start" type="date"></div>
        <div class="f"><label for="e_end">종료일</label><input id="e_end" type="date"></div>
      </div>
      <div class="g2c">
        <div class="f"><label for="e_allday">시간</label><select id="e_allday" onchange="toggleTime()"><option value="1">종일</option><option value="0">시간 지정</option></select></div>
        <div class="f" id="timeRow" style="display:none"><label>시작시간 ~ 완료시간</label><div style="display:flex;gap:4px"><input id="e_st" type="time" step="1800"><input id="e_et" type="time" step="1800"></div></div>
      </div>
      <div class="g2c">
        <div class="f"><label for="e_type">유형 (배색)</label>
          <select id="e_type">
            <option value="g2trip">G2 출장</option>
            <option value="g3trip">G3 출장</option>
            <option value="g2meet">G2 회의</option>
            <option value="g3meet">G3 회의</option>
            <option value="g2event">G2 행사</option>
            <option value="g3event">G3 행사</option>
            <option value="holiday">휴일·공휴일</option>
          </select></div>
        <div class="f"><label for="e_region">지역</label><input id="e_region" placeholder="중국 · 상해"></div>
      </div>
      <label class="ck"><input type="checkbox" id="e_vp"><span class="vpmark">★</span> 정부사장님 참석</label>
      <div>
        <button class="tgl" id="tglTravel" onclick="toggleTravel()">✈ 이동 정보 (항공·기차·터미널·첨부)<span class="ar">▶</span></button>
        <div class="tbox" id="travelBox" style="display:none">
          <div class="g2c">
            <div class="f"><label for="tr_mode">수단</label><select id="tr_mode"><option>항공</option><option>기차(KTX/고속철)</option><option>차량</option><option>기타</option></select></div>
            <div class="f"><label for="tr_no">편명 / 열차번호</label><input id="tr_no" placeholder="KE893"></div>
            <div class="f"><label for="tr_from">출발지</label><input id="tr_from" placeholder="인천(ICN)"></div>
            <div class="f"><label for="tr_fromTime">출발 시각</label><input id="tr_fromTime" type="time" step="300"></div>
            <div class="f"><label for="tr_to">도착지</label><input id="tr_to" placeholder="상해(PVG)"></div>
            <div class="f"><label for="tr_toTime">도착 시각</label><input id="tr_toTime" type="time" step="300"></div>

function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addD(s,n){const d=pd(s);d.setDate(d.getDate()+n);return fmt(d)}
function uid(){return 'ev'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hhmm(t){return t?t.slice(0,5):''}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}

function migrateOld(old){ // v1(status/targets) → v2(type/vp)
  const G3KW=/미국|멕시코|칠레|콜롬비아|캐나다|뉴저지|벤쿠버|시카고|중남미|북미|AAOMS|AAID|AAP|GNYDM|NASM|AMIC|NYU|LASM|ICOI|티후아나/;
  (old.events||[]).forEach(e=>{
    if(e.type)return;
    const tg=e.targets||[];e.vp=tg.includes('VP');
    if(e.status==='holiday'){e.type='holiday';e.vp=false}
    else{const side=(tg.includes('G3')||G3KW.test(e.title))?'g3':'g2';
      e.type=e.status==='milestone'?side+'event':(/미팅|회의|리뷰/.test(e.title)?side+'meet':side+'trip')}
    delete e.status;delete e.targets;
  });
  return old;
}
function load(){
  try{const s=localStorage.getItem(LS_SET);if(s)SET=Object.assign(SET,JSON.parse(s))}catch(e){}
  try{
    let d=localStorage.getItem(LS_KEY);
    if(d){DB=JSON.parse(d)}
    else{
      const o=localStorage.getItem(LS_OLD);
      if(o){DB=migrateOld(JSON.parse(o));toast('기존 데이터를 새 구분 체계로 변환했습니다')}
      else DB={events:JSON.parse(JSON.stringify(SEED)),notes:{},updatedAt:''};
    }
    if(!DB.events)DB.events=[];if(!DB.notes)DB.notes={};
  }catch(e){DB={events:JSON.parse(JSON.stringify(SEED)),notes:{},updatedAt:''}}
}
let cloudTimer=null;
function persist(){
  DB.updatedAt=new Date().toISOString();
  try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){toast('로컬 저장 실패: '+e.message)}
  if(SET.gasUrl&&SET.autoCloud){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSave(false),1500)}
  hdrStat();
}
function hdrStat(extra){
  document.getElementById('hdrStat').textContent=extra||((SET.gasUrl?'☁ 드라이브 연동':'로컬 저장')+' · '+DB.events.length+'건');
}

function visible(e){
  if(e.type==='holiday')return true;
  if(F.vp&&e.vp)return true;
  if(F.g2&&(e.type==='g2trip'||e.type==='g2meet'))return true;
  if(F.g3&&(e.type==='g3trip'||e.type==='g3meet'))return true;
  if(F.g2e&&e.type==='g2event')return true;
  if(F.g3e&&e.type==='g3event')return true;
  return false;
}

function weekStartOf(s){const d=pd(s);d.setDate(d.getDate()-d.getDay());return fmt(d)}

  const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  const last=new Date(y,m+1,0);const nWeeks=Math.ceil((last.getDate()+first.getDay())/7);
  const allWs=[];for(let w=0;w<nWeeks;w++)allWs.push(fmt(new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7)));
  const focus=selWeek&&allWs.includes(selWeek);
  let h='<div class="month"><div class="dow"><div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div></div>';
  for(let w=0;w<nWeeks;w++){
    const ws=allWs[w],we=addD(ws,6);
    const sel=selWeek===ws;
    if(focus&&!sel)continue;
    h+='<div class="week'+(sel?' sel':'')+'" onclick="selectWeek(\''+ws+'\')">';
    for(let i=0;i<7;i++){const ds=addD(ws,i),d=pd(ds);const out=d.getMonth()!==m;
      h+='<div class="d'+(out?' out':'')+(i===0?' sun':i===6?' sat':'')+'" style="grid-column:'+(i+1)+';grid-row:1">'+(ds===TODAY?'<span class="today">'+d.getDate()+'</span>':(d.getDate()===1?(d.getMonth()+1)+'/1':d.getDate()))+'<span class="add" onclick="event.stopPropagation();openEvent(null,\''+ds+'\')">+</span></div>';
    }
    // 줄 순서: 출장 → 회의 → 행사 → 휴일
    const evs=DB.events.filter(e=>visible(e)&&e.start<=we&&e.end>=ws)
      .sort((a,b)=>PRI[a.type]-PRI[b.type]||(a.start<b.start?-1:a.start>b.start?1:(b.end>a.end?1:-1)));
    let base=0,curPri=-1,lanes=[];
    evs.forEach(e=>{
      if(PRI[e.type]!==curPri){base+=lanes.length;lanes=[];curPri=PRI[e.type]}
      const s=e.start<ws?0:pd(e.start).getDay(),en=e.end>we?6:pd(e.end).getDay();
      let li=lanes.findIndex(l=>l.every(r=>en<r.s||s>r.e));if(li<0){lanes.push([]);li=lanes.length-1}lanes[li].push({s,e:en});
      h+='<div class="ev '+e.type+'" style="grid-column:'+(s+1)+'/'+(en+2)+';grid-row:'+(base+li+2)+'" onclick="event.stopPropagation();openEvent(\''+e.id+'\')" title="'+esc(TYPE_NAME[e.type]+' · '+e.title)+'">'+(e.vp?'<span class="m">★</span>':'')+(isTravel(e)?'<span class="m">✈</span>':'')+(e.allDay===false&&e.startTime?'<span class="m">'+hhmm(e.startTime)+'</span>':'')+esc(e.title)+'</div>';
    });
    h+='</div>';
    if(sel)h+=renderWeek(ws);
  }
  h+='</div>';
  document.getElementById('viewMonth').innerHTML=h;
}
function selectWeek(ws){selWeek=selWeek===ws?null:ws;renderMonth()}

/* ===================== 주간 패널 ===================== */
function renderWeek(ws){
  const days=[];for(let i=(SET.weekend?0:1);i<=(SET.weekend?6:5);i++)days.push(addD(ws,i));
  const nd=days.length;const H0=Number(SET.h0)||8,H1=Number(SET.h1)||21;const nr=(H1-H0)*2+2;
  const dn=['\uc77c','\uc6d4','\ud654','\uc218','\ubaa9','\uae08','\ud1a0'];
  const d0=days[0],dl=days[nd-1];
  const holOf=d=>DB.events.find(e=>e.type==='holiday'&&e.start<=d&&e.end>=d);
  let h='<div class="wk" onclick="event.stopPropagation()"><div class="head"><span class="h">\uc8fc\uac04 \u00b7 '+d0.slice(5).replace('-','.')+'('+dn[pd(d0).getDay()]+') ~ '+dl.slice(5).replace('-','.')+'('+dn[pd(dl).getDay()]+')</span><span style="font-size:11px;color:var(--mute)">\ube48 \uc2dc\uac04\uce78 \ud074\ub9ad \u2192 \ud68c\uc758 \uc785\ub825</span><span class="r"><button class="ibtn" onclick="moveWeek(-1)">\u25c0 \uc774\uc804 \uc8fc</button><button class="ibtn" onclick="moveWeek(1)">\ub2e4\uc74c \uc8fc \u25b6</button><button class="ibtn" onclick="exportWeekImage()">\uc774\ubbf8\uc9c0</button><button class="ibtn" onclick="selWeek=null;renderMonth()">\ub2eb\uae30 \u00d7</button></span></div>';
  h+='<div class="wkwrap"><div class="wkin" style="--nd:'+nd+';--nr:'+nr+'">';
  // \ucd9c\uc7a5\u00b7\uc774\ub3d9: \uc885\uc77c \uc77c\uc815\uc744 \uc8fc \uc804\uccb4\uc5d0 \uac78\uce58\ub294 \ud558\ub098\uc758 \ub9c9\ub300\ub85c
  const span=DB.events.filter(e=>visible(e)&&e.allDay!==false&&e.start<=dl&&e.end>=d0)
    .sort((a,b)=>PRI[a.type]-PRI[b.type]||(a.start<b.start?-1:a.start>b.start?1:(b.end>a.end?1:-1)));
  const bars=[];const lanes=[];
  span.forEach(e=>{
    const cs=e.start<d0?d0:e.start, ce=e.end>dl?dl:e.end;
    const si=days.indexOf(cs), ei=days.indexOf(ce);
    if(si<0||ei<0)return;
    let li=lanes.findIndex(l=>l.every(r=>ei<r.s||si>r.e));
    if(li<0){lanes.push([]);li=lanes.length-1}
    lanes[li].push({s:si,e:ei});
    bars.push({e,si,ei,li});
  });
  const nl=Math.max(1,lanes.length);
  h+='<div class="rowS"><div class="lab" style="grid-row:1/'+(nl+1)+'">\ucd9c\uc7a5<br>\u00b7\uc774\ub3d9</div>';
  bars.forEach(b=>{
    const e=b.e,t=e.travel||{};
    let txt;
    if(isTravel(e)){
      txt='\u2708 '+esc(t.from||t.to?((t.from||'?')+' \u2192 '+(t.to||'?')):e.title)+' \u00b7 '+(t.no?esc(t.no):'[\ud3b8\uba85]')+(t.fromTime?' \u00b7 \ucd9c\ubc1c '+hhmm(t.fromTime):'')+(t.toTime?' \u00b7 \ub3c4\ucc29 '+hhmm(t.toTime):'')+(t.terminal?' \u00b7 '+esc(t.terminal):'')+((e.attachments||[]).length?' \ud83d\udcce':'');
    }else{
      txt=(e.vp?'<span class="m">\u2605</span>':'')+esc(e.title);
    }
    h+='<div class="ev '+e.type+'" style="grid-column:'+(b.si+2)+'/'+(b.ei+3)+';grid-row:'+(b.li+1)+'" onclick="openEvent(\''+e.id+'\')" title="'+esc(TYPE_NAME[e.type]+' \u00b7 '+e.title)+'">'+txt+'</div>';
  });
  h+='</div>';
  // \uc694\uc77c \ud5e4\ub354 + \ud68c\uc758 \ucd94\uac00 \ubc84\ud2bc
  h+='<div class="wkgrid rowH"><div></div>';
  days.forEach(d=>{const hol=holOf(d);const dd=pd(d);
    h+='<div><div class="dn'+(dd.getDay()===0?' sun':'')+(hol?' hol':'')+(d===TODAY?' today':'')+'">'+dn[dd.getDay()]+' '+d.slice(5).replace('-','.')+(d===TODAY?' (\uc624\ub298)':'')+'</div>';
    if(hol)h+='<div class="hn">'+esc(hol.title)+'</div>';
    else h+='<div><button class="mini g2m" onclick="addMeet(\''+d+'\',\'g2meet\')">\uff0bG2\ud68c\uc758</button><button class="mini g3m" onclick="addMeet(\''+d+'\',\'g3meet\')">\uff0bG3\ud68c\uc758</button></div>';
    h+='</div>'});
  h+='</div>';
  // \uc2dc\uac04 \uadf8\ub9ac\ub4dc (\uc77c\ubcc4 \ud68c\uc758 \uc785\ub825, \uc2dc\uc791~\uc644\ub8cc \uc140 \ubcd1\ud569)
  h+='<div class="timegrid">';
  for(let r=0;r<nr;r++){const hr=H0+Math.floor(r/2),half=r%2;const lab=r===nr-1?'\uc57c\uac04':(half?'':hr+':00');h+='<div class="tl'+((hr===12||hr===18)&&!half?' h':'')+'" style="grid-row:'+(r+1)+'">'+lab+'</div>'}
  days.forEach((d,ci)=>{const hol=holOf(d);
    if(hol){h+='<div class="daycol hol" style="grid-column:'+(ci+2)+';grid-row:1/'+(nr+1)+'">'+esc(hol.title)+'</div>';return}
    h+='<div class="daycol'+(d===TODAY?' today':'')+'" style="grid-column:'+(ci+2)+';grid-row:1/'+(nr+1)+';cursor:copy" title="\ube48 \uce78 \ud074\ub9ad: \uadf8 \uc2dc\uac04 \ud68c\uc758 \uc785\ub825" onclick="addAt(event,\''+d+'\')">';
    for(let r=1;r<nr;r+=2)h+='<div class="hl" style="top:'+(r*15)+'px"></div>';
    const toRow=t=>{const [hh,mm]=t.split(':').map(Number);return Math.max(0,Math.min(nr-1,(hh-H0)*2+(mm>=30?1:0)))};
    const timed=DB.events.filter(e=>visible(e)&&e.allDay===false&&e.start<=d&&e.end>=d).map(e=>{
      const r0=toRow(e.startTime||(H0+':00'));let r1=e.endTime?toRow(e.endTime):r0+2;if(r1<=r0)r1=r0+1;return {e,r0,r1}})
      .sort((a,b)=>a.r0-b.r0||PRI[a.e.type]-PRI[b.e.type]);
    const cols=[[],[],[]];
    timed.forEach(x=>{let ci2=cols.findIndex(c=>c.every(o=>x.r1<=o.r0||x.r0>=o.r1));if(ci2<0)ci2=2;cols[ci2].push(x);
      h+='<div class="tev '+x.e.type+'" style="grid-column:'+(ci2+1)+';grid-row:'+(x.r0+1)+'/'+(x.r1+1)+'" onclick="event.stopPropagation();openEvent(\''+x.e.id+'\')">'+(x.e.vp?'\u2605 ':'')+hhmm(x.e.startTime)+(x.e.endTime?'~'+hhmm(x.e.endTime):'')+' '+esc(x.e.title)+'</div>'});
    h+='</div>'});
  h+='</div>';
  // \ud2b9\uc774\uc0ac\ud56d
  h+='<div class="wkgrid rowN"><div class="lab">\ud2b9\uc774\uc0ac\ud56d</div>';
  days.forEach(d=>{h+='<div><div class="note" ondblclick="this.contentEditable=true;this.focus()" onblur="this.contentEditable=false;saveNote(\''+d+'\',this.innerText)">'+esc(DB.notes[d]||'')+'</div></div>'});
  h+='</div></div></div></div>';
  return h;
}

function addAt(ev,d){
  if(ev.target!==ev.currentTarget)return;
  const H0=Number(SET.h0)||8;
  const y=ev.clientY-ev.currentTarget.getBoundingClientRect().top;
  const row=Math.max(0,Math.floor(y/15));
  const hr=H0+Math.floor(row/2),mm=row%2?'30':'00';
  openEvent(null,d,String(hr).padStart(2,'0')+':'+mm,String(hr+1).padStart(2,'0')+':'+mm,'g2meet');
}
function openEvent(id,date,st0,et0,typ0){
  editing=id?DB.events.find(e=>e.id===id):null;
  const e=editing||{title:'',start:date||fmt(cur),end:date||fmt(cur),allDay:!st0,startTime:st0||'',endTime:et0||'',type:typ0||'g2trip',vp:true,region:'',travel:{},attachments:[],memo:''};
  document.getElementById('evTitleH').textContent=editing?'일정 상세':'새 일정';
  document.getElementById('btnDel').style.display=editing?'':'none';
  v('e_title',e.title);v('e_start',e.start);v('e_end',e.end);v('e_allday',e.allDay===false?'0':'1');v('e_st',e.startTime||'');v('e_et',e.endTime||'');
  v('e_type',e.type||'g2trip');v('e_region',e.region||'');v('e_memo',e.memo||'');
  document.getElementById('e_vp').checked=!!e.vp;
  const t=e.travel||{};v('tr_mode',t.mode||'항공');v('tr_no',t.no||'');v('tr_from',t.from||'');v('tr_fromTime',t.fromTime||'');v('tr_to',t.to||'');v('tr_toTime',t.toTime||'');v('tr_pnr',t.pnr||'');
  setTerm(t.terminal||'');editAtt=JSON.parse(JSON.stringify(e.attachments||[]));renderAtt();
  setTravelOpen(isTravel(e)||editAtt.length>0);
  toggleTime();
  document.getElementById('attHint').textContent=SET.gasUrl?'파일은 드라이브 G2G3일정/첨부 폴더에 저장됩니다':'파일 업로드는 설정에서 Apps Script 연결 후 가능 · 지금은 링크 붙여넣기만';

}

async function uploadAtt(files){
  if(!SET.gasUrl){toast('먼저 설정에서 Apps Script를 연결하세요');return}
  for(const f of files){
    if(f.size>8*1024*1024){toast(f.name+': 8MB 초과');continue}
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
    toast(f.name+' 업로드 중…');
    try{const r=await gas({action:'upload',name:f.name,mime:f.type||'application/octet-stream',data:b64});if(r.ok){editAtt.push({name:f.name,url:r.url,fileId:r.fileId});renderAtt();toast('업로드 완료')}else toast('업로드 실패: '+(r.error||''))}catch(e){toast('업로드 실패: '+e.message)}
  }
  document.getElementById('attFile').value='';
}
function collectTravel(){
  const t={mode:g('tr_mode'),no:g('tr_no').trim(),from:g('tr_from').trim(),fromTime:g('tr_fromTime'),to:g('tr_to').trim(),toTime:g('tr_toTime'),terminal:editTerm,pnr:g('tr_pnr').trim()};
  return (t.no||t.from||t.to||t.fromTime||t.toTime||t.terminal||t.pnr)?t:{};
}
function saveEvent(){

  let s=g('e_start'),en=g('e_end')||s;if(!s){toast('시작일을 입력하세요');return}if(en<s)en=s;
  const obj={id:editing?editing.id:uid(),title,start:s,end:en,allDay:g('e_allday')==='1',startTime:g('e_st'),endTime:g('e_et'),type:g('e_type'),vp:document.getElementById('e_vp').checked,region:g('e_region').trim(),memo:g('e_memo'),travel:collectTravel(),attachments:editAtt};
  if(editing)Object.assign(editing,obj);else DB.events.push(obj);
  persist();closeEvent();render();toast('저장됨');
}
function deleteEvent(){if(!editing)return;if(!confirm('이 일정을 삭제할까요?'))return;DB.events=DB.events.filter(e=>e.id!==editing.id);persist();closeEvent();render();toast('삭제됨')}

  }else if(manual)slog(r.ok?'클라우드에 데이터가 없습니다':'실패: '+(r.error||''))}catch(e){if(manual)slog('불러오기 실패: '+e.message)}
}
function calDesc(e){const t=e.travel||{};const L=[];L.push('유형: '+TYPE_NAME[e.type]+(e.vp?' · 정부사장님 참석':''));if(e.region)L.push('지역: '+e.region);if(isTravel(e))L.push('이동: '+[t.mode,t.no,(t.from&&t.to)?t.from+' → '+t.to:'',t.fromTime?'출발 '+hhmm(t.fromTime):'',t.toTime?'도착 '+hhmm(t.toTime):'',t.terminal?'터미널 '+t.terminal:'',t.pnr?'예약 '+t.pnr:''].filter(Boolean).join(' · '));(e.attachments||[]).forEach(a=>L.push('첨부: '+a.name+' '+a.url));if(e.memo)L.push('아젠다: '+e.memo);return L.join('\n')}
async function pushCalendar(){
  if(!SET.gasUrl){slog('Apps Script 연결이 필요합니다');return}
  const y=cur.getFullYear(),m=cur.getMonth();const ms=fmt(new Date(y,m,1)),me=fmt(new Date(y,m+1,0));
  const evs=DB.events.filter(e=>e.start<=me&&e.end>=ms&&e.type!=='holiday');
  if(!confirm(evs.length+'건을 구글캘린더(기본 캘린더)에 등록/갱신할까요?'))return;
  slog('구글캘린더 등록 중…');
  try{const r=await gas({action:'calendar',events:evs.map(e=>({id:e.id,title:(e.vp?'★':'')+e.title,start:e.start,end:e.end,allDay:e.allDay!==false,startTime:e.startTime,endTime:e.endTime,desc:calDesc(e)}))});slog(r.ok?'완료 · 신규 '+r.created+'건, 갱신 '+r.updated+'건':'실패: '+(r.error||''))}catch(e){slog('실패: '+e.message)}
}
function exportICS(){
  const y=cur.getFullYear(),m=cur.getMonth();const ms=fmt(new Date(y,m,1)),me=fmt(new Date(y,m+1,0));
  const evs=DB.events.filter(e=>visible(e)&&e.start<=me&&e.end>=ms);
  const d8=s=>s.replace(/-/g,'');const esc2=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MegaGen G2G3//KO\r\n';
  evs.forEach(e=>{ics+='BEGIN:VEVENT\r\nUID:'+e.id+'@g2g3\r\nSUMMARY:'+esc2(e.title)+'\r\n';
    if(e.allDay===false&&e.startTime){ics+='DTSTART:'+d8(e.start)+'T'+e.startTime.replace(':','')+'00\r\nDTEND:'+d8(e.end)+'T'+(e.endTime||e.startTime).replace(':','')+'00\r\n'}else{ics+='DTSTART;VALUE=DATE:'+d8(e.start)+'\r\nDTEND;VALUE=DATE:'+d8(addD(e.end,1))+'\r\n'}
    ics+='DESCRIPTION:'+esc2(calDesc(e))+'\r\nEND:VEVENT\r\n'});
  ics+='END:VCALENDAR\r\n';
  dl(new Blob([ics],{type:'text/calendar'}),'G2G3_'+y+'-'+String(m+1).padStart(2,'0')+'.ics');
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportJSON(){dl(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),'G2G3_schedule_backup_'+TODAY+'.json')}
function importJSON(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.events)throw new Error('events 없음');if(!confirm(d.events.length+'건으로 현재 데이터를 교체할까요?'))return;DB=migrateOld(d);if(!DB.notes)DB.notes={};persist();render();toast('복원 완료')}catch(e){toast('복원 실패: '+e.message)}};r.readAsText(f)}
function resetSeed(){if(!confirm('엑셀(2026.09.08 updated) 기준 초기 일정 '+SEED.length+'건으로 되돌립니다. 현재 입력한 내용은 사라집니다. 계속할까요?'))return;DB={events:JSON.parse(JSON.stringify(SEED)),notes:{},updatedAt:''};persist();render();toast('초기화 완료')}

/* ===================== 시작 ===================== */
load();
selWeek=weekStartOf(TODAY);
render();
if(SET.gasUrl)cloudLoad(false);
