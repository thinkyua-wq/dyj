<style>
:root{
  --bg:#F4F3F0; --card:#FFFFFF; --line:#D8D6D0; --line2:#EBE9E4;
  --ink:#1B1F26; --ink2:#4A4E55; --mute:#7A7E85; --teal:#3F4A57; --teal2:#E9EBEE; --red:#9E2B25;
  /* G2 중화 = 빨간색 계열 / G3 미주 = 파란색 계열 */
  --g2t:#9E2B25; --g2m:#4A545E; --g2eBg:#F7E4E2; --g2eTx:#8C2620;
  --g3t:#1D4E89; --g3m:#98A2AC; --g3eBg:#E2EBF6; --g3eTx:#1A4477;
  --pers:#6B7A45; --hol:#DAD7D0; --vpc:#3F4A57;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
.main{max-width:1440px;margin:0 auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.mcal{position:absolute;right:12px;top:54px;z-index:30;width:238px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.mcal .mh{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.mcal .mh b{font-size:14px;font-weight:700;flex-grow:1}
.mcal .mh button{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;cursor:pointer;color:var(--ink);line-height:1}
.mcal .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.mcal .mg .w{font-size:10px;color:var(--mute);padding:3px 0;font-weight:700}
.mcal .mg .w.su{color:var(--red)} .mcal .mg .w.sa{color:var(--g3t)}
.mcal .mg .c{font-size:11.5px;padding:6px 0;border-radius:50%;cursor:pointer;position:relative;color:var(--ink)}
.mcal .mg .c:hover{background:#EFEEE9}
.mcal .mg .c.out{color:#BDBFC4}
.mcal .mg .c.su{color:var(--red)} .mcal .mg .c.sa{color:var(--g3t)}
.mcal .mg .c.sel{background:var(--ink);color:#fff;font-weight:700}
.mcal .mg .c.today{background:#2B4FD8;color:#fff;font-weight:700}
.mcal .mg .c.hol{background:#8E1B16;color:#fff;font-weight:700}
.mcal .mg .c .dot{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:3px;height:3px;border-radius:2px;background:var(--g2t)}
.mcal .mg .c.sel .dot,.mcal .mg .c.today .dot,.mcal .mg .c.hol .dot{background:#fff}
.fchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.fchips button{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border:1.5px solid var(--line);background:#fff;border-radius:15px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;opacity:.42;white-space:nowrap}
.fchips button.on{opacity:1;color:var(--ink);border-color:currentColor}
.fchips i{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.fchips .ck{display:none}
/* ---------- 상단 ---------- */
.bar{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;color:var(--vpc)}
.brand small{font-weight:400;color:var(--mute);font-size:11px;margin-left:6px}
.ibtn{height:34px;min-width:34px;padding:0 11px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--ink)}
.ibtn:hover{background:#F6F5F1}
.ibtn.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.ibtn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.mtitle{font-size:18px;font-weight:700;min-width:110px;text-align:center}
.legend{margin-left:auto;display:flex;flex-wrap:wrap;gap:3px 14px;font-size:11.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;padding:3px 8px;border-radius:12px;border:1px solid transparent;opacity:.35;user-select:none}
.legend span.on{opacity:1;background:#F2F1EC;border-color:var(--line)}
.legend span:hover{background:#EEEDE8}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block;flex-shrink:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{height:31px;padding:0 13px;border-radius:16px;border:1.5px solid;background:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;flex-shrink:0;opacity:.45}
.chip.on{opacity:1;color:#fff}
.chip.vp{border-color:var(--vpc);color:var(--vpc)} .chip.vp.on{background:var(--vpc);color:#fff}
.chip.g2{border-color:var(--g2t);color:var(--g2t)} .chip.g2.on{background:var(--g2t);color:#fff}
.chip.g3{border-color:var(--g3t);color:var(--g3t)} .chip.g3.on{background:var(--g3t);color:#fff}
.chip.g2e{border-color:var(--g2eTx);color:var(--g2eTx)} .chip.g2e.on{background:var(--g2eTx);color:#fff}
.chip.g3e{border-color:var(--g3eTx);color:var(--g3eTx)} .chip.g3e.on{background:var(--g3eTx);color:#fff}
.stat{font-size:11px;color:var(--mute);margin-left:auto;white-space:nowrap}
/* ---------- 월간 ---------- */
.month{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ybar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.ybar .yt{font-size:17px;font-weight:700;min-width:82px;text-align:center}
.mchip{height:30px;min-width:40px;padding:0 10px;border:1.5px solid var(--line);background:#fff;border-radius:15px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.mchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mchip.has{border-color:var(--g2t)}
.mchip.on.has{background:var(--g2t);border-color:var(--g2t)}
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--zw,380px),1fr));gap:10px}
.ymon{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ymon h4{margin:0;padding:7px 10px;background:#EEEDE8;font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;cursor:pointer}
.ymon h4 small{margin-left:auto;font-weight:400;color:var(--mute);font-size:11px}
.ymon .mdow{display:grid;grid-template-columns:repeat(5,1fr) repeat(2,0.8fr);font-size:10px;color:var(--mute);padding:3px 4px 0;text-align:center}
.ymon .mdow .sa{color:var(--g3t)} .ymon .mdow .su{color:var(--red)}
.ymon .mbody{padding:4px}
.ymon .mwk{display:grid;grid-template-columns:repeat(5,1fr) repeat(2,0.8fr);grid-auto-rows:minmax(14px,auto);gap:1px 0;padding:2px 0 4px;border-bottom:1px solid #F0EEE8}
.ymon .mwk:last-child{border-bottom:0}
.ymon .md{font-size:var(--zf,9.5px);font-weight:700;color:var(--ink2);text-align:center;cursor:pointer;line-height:1.4}
.ymon .md.out{color:#C6C8CC;font-weight:400}
.ymon .md.sa{color:var(--g3t)} .ymon .md.su{color:var(--red)}
.ymon .md .tdy{background:#2B4FD8;color:#fff;border-radius:9px;padding:1px 5px}
.ymon .md .hlc{background:#8E1B16;color:#fff;border-radius:9px;padding:1px 5px}
.ymon .yev{margin:0 1px;border-radius:3px;padding:0 3px;font-size:var(--zf,9.5px);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ymon .ymore{font-size:8.5px;color:var(--mute);padding-left:4px}
.ymon .yev.g2trip{background:var(--g2t);color:#fff}
.ymon .yev.g3trip{background:var(--g3t);color:#fff}
.ymon .yev.g2event{background:var(--g2eBg);color:var(--g2eTx);box-shadow:inset 3px 0 0 var(--g2eTx)}
.ymon .yev.g3event{background:var(--g3eBg);color:var(--g3eTx);box-shadow:inset 3px 0 0 var(--g3eTx)}
.ymon .mc .more{font-size:8.5px;color:var(--mute)}
@media (max-width:640px){.ygrid{grid-template-columns:1fr}}
.dow{display:grid;grid-template-columns:40px repeat(5,minmax(0,1fr)) repeat(2,minmax(0,0.6fr));background:#EEEDE8;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink2)}
.dow div{padding:7px 8px}
.dow .sun{color:var(--red)} .dow .sat{color:var(--vpc)}
.week{display:grid;cursor:default;position:relative;grid-template-columns:40px repeat(5,minmax(0,1fr)) repeat(2,minmax(0,0.6fr));grid-auto-rows:21px;gap:3px 0;padding:3px 0 6px;border-bottom:2px solid var(--line);font-size:11.5px;min-height:96px;align-content:start;padding-bottom:10px}

.week.sel{background:var(--teal2);box-shadow:inset 4px 0 0 var(--teal)}
.week .wbtn{position:relative;z-index:2;grid-column:1;margin:0 3px;border-radius:5px;background:#E9E8E3;color:var(--ink2);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;height:19px;border:1px solid var(--line)}
.week .wbtn:hover{background:var(--teal);border-color:var(--teal);color:#fff}
.week .wbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.week .sdiv{pointer-events:none;align-self:center;height:0;border-top:1px dashed #D5D2CA;margin:0 6px}
.week .sband{pointer-events:none;border-radius:6px;margin:0 2px}
.week .sband.s-trip{background:rgba(158,43,37,.045)}
.week .sband.s-meet{background:rgba(74,84,94,.05)}
.week .sband.s-evt{background:rgba(29,78,137,.04)}
.week .ev.multi{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 5px,transparent 5px 10px)}
.week .emore{font-size:9.5px;font-weight:700;color:var(--mute);background:#EEEDE8;border-radius:4px;margin:0 3px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1;line-height:1}
.week .emore:hover{background:var(--teal);color:#fff}
.week .slab{grid-column:1;font-size:9px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;border-radius:5px;margin:0 3px;line-height:1.1;text-align:center;z-index:1}
.week .slab.s-trip{background:rgba(158,43,37,.10);color:#8C2620}
.week .slab.s-meet{background:rgba(74,84,94,.12);color:#3E4750}
.week .slab.s-evt{background:rgba(29,78,137,.10);color:#1A4477}
.week .d{position:relative;z-index:1;padding:0 7px;font-weight:700;display:flex;align-items:center;gap:5px}
.week .d.out{color:#A3A6AB;font-weight:400}
.week .d.sun{color:var(--red)} .week .d.sat{color:var(--vpc)}
.week .d .today{width:21px;height:21px;border-radius:11px;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.week .d .holc{width:21px;height:21px;border-radius:11px;background:#8E1B16;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.rowH .dn .holc{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:#8E1B16;color:#fff;font-size:11px;vertical-align:middle}
.week .d .add{margin-left:auto;opacity:0;font-size:14px;color:var(--teal);font-weight:700;padding:0 3px}
.week .d:hover .add{opacity:1}
.ev{position:relative;z-index:1;margin:0 3px;padding:0 6px;border-radius:4px;line-height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-size:11.5px}
.ev.g2trip{background:var(--g2t);color:#fff} .ev.g3trip{background:var(--g3t);color:#fff}
.ev.g2meet{background:var(--g2m);color:#fff} .ev.g3meet{background:var(--g3m);color:#fff}
.ev.g2event{background:var(--g2eBg);color:var(--g2eTx);border-left:3px solid var(--g2eTx);line-height:19px}
.ev.g3event{background:var(--g3eBg);color:var(--g3eTx);border-left:3px solid var(--g3eTx);line-height:19px}
.ev.personal{background:var(--pers);color:#fff}
.ev.holiday{background:var(--hol);color:var(--ink2)}
.ev .m{font-weight:700;margin-right:3px;opacity:.9}
.ev .tinfo{margin-left:5px;opacity:.82;font-weight:600}
/* ---------- 주간 패널 ---------- */
.wk{background:#fff;border-top:3px solid var(--teal);border-bottom:1px solid var(--line);cursor:default}
.wk .head{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.wk .head .h{font-size:14.5px;font-weight:700;color:var(--vpc)}
.wk .head .backable{cursor:pointer;border-radius:5px;padding:2px 5px}
.wk .head .backable:hover{background:#EDEBE5}
.wk .head .r{margin-left:auto;display:flex;gap:5px}
.wk .head .ibtn{height:30px;font-size:12px}
.stepper{display:inline-flex;align-items:center;gap:0;height:30px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.stepper button{width:28px;height:28px;border:0;background:#fff;font-size:14px;color:var(--ink);cursor:pointer;line-height:1}
.stepper button:hover{background:#F0EFEA}
.stepper input{width:34px;height:28px;border:0;border-left:1px solid var(--line2);border-right:0;text-align:center;font-size:13px;font-weight:700;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .u{font-size:11px;color:var(--mute);padding:0 5px 0 1px;border-right:1px solid var(--line2)}
.wkwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wkin{min-width:720px}
.wkin[style*='1fr;']{min-width:0}
.wkgrid{display:grid;grid-template-columns:var(--cols);font-size:11.5px}
.wkgrid>div{border-left:1px solid var(--line2)}
.wkgrid>div:first-child{border-left:0}
.wkgrid .lab{padding:6px 7px;color:var(--mute);font-weight:700;font-size:10.5px;display:flex;align-items:center}
.rowT{background:#FBFAF7;border-bottom:1px solid var(--line2)}
.rowT>div{padding:6px 5px;display:flex;flex-direction:column;gap:4px;min-height:36px}
.tcard{display:flex;flex-direction:column;gap:2px;padding:6px 8px;background:#FFFFFF;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;font-size:11px}
.tcard.g2trip,.tcard.g2meet,.tcard.g2event{border-color:var(--g2t);color:var(--g2t)}
.tcard.g3trip,.tcard.g3meet,.tcard.g3event{border-color:var(--g3t);color:var(--g3t)}
.rowS .tcard{margin:0 3px;justify-content:center}
.tcard.one{flex-direction:row;align-items:center;gap:7px;padding:0 9px;height:23px;line-height:23px;white-space:nowrap;overflow:hidden}
.tcard.one b{flex-shrink:0;font-size:11.5px}
.tcard.one .dt{color:var(--ink2);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.tcard b{font-size:11.5px}
.tcard .m{color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap}
.tcard .term{font-weight:700}
.tcard a{color:var(--teal);text-decoration:none}
.rowH{background:#EEEDE8;border-bottom:1px solid var(--line)}
.rowH>div{padding:6px 6px}
.rowH .dhead{cursor:pointer}
.rowH .dhead:hover{background:#E4E2DC}
.rowH .dn{font-weight:700;font-size:12px}
.rowH .dhead:hover .dn:after{content:' \2191';color:var(--teal);font-size:10px}
.rowH>div:nth-child(7) .dn,.rowH>div:nth-child(8) .dn{font-size:11px}
.rowH>div:nth-child(7) .hsplit,.rowH>div:nth-child(8) .hsplit{grid-template-columns:1fr;gap:1px}

.rowH .dn.sun,.rowH .dn.hol{color:var(--red)}
.rowH .dn.today{color:var(--teal)}
.rowH .hn{font-size:10px;color:var(--mute)}
.hsplit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;margin-top:3px;font-size:9.5px;text-align:center}
.hsplit>div{border-radius:3px;padding:2px 4px;line-height:1.35;display:flex;align-items:center;justify-content:center;gap:4px}
.hsplit.one{grid-template-columns:1fr}

.hsplit .vpx{background:#E8E6E0;color:var(--ink2)}
.hsplit .team{background:#E8E6E0;color:var(--ink2)}
.addico{display:flex;gap:3px}
.addico button{width:20px;height:15px;border:0;border-radius:3px;font-size:9px;font-weight:700;color:#fff;line-height:15px;padding:0;cursor:pointer}
.addico .a1{background:rgba(255,255,255,.28)}
.addico .ag2{background:var(--g2m)} .addico .ag3{background:var(--g3m)}
.rowA{border-bottom:1px solid var(--line2)}

.att{display:flex;flex-direction:column;gap:4px}

.imgatt.saved .cap{color:var(--mute)}
.imgatt.saved img{background:#E6E4DE}
.imgatt .s-ok{color:var(--mute);font-weight:700}
.imgatt .s-pend{color:var(--g3t);font-weight:700}
.imgatt .s-loc{color:var(--g2t);font-weight:700}
.att a{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:12px;text-decoration:none;color:var(--teal)}
.att a .x{margin-left:auto;color:var(--red);font-weight:700;padding:0 4px}
.panel .pf{margin-top:auto;display:flex;gap:8px;padding:13px 16px;border-top:1px solid var(--line2);position:sticky;bottom:0;background:#fff}
.dbtn{height:40px;padding:0 16px;border:1px solid var(--red);background:#fff;color:var(--red);border-radius:7px;font-size:13px}
.sbtn{height:40px;padding:0 20px;border:0;background:var(--teal);color:#fff;border-radius:7px;font-size:13.5px;font-weight:700}
.cbtn{height:40px;padding:0 16px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:13px}
.hint{font-size:11.5px;color:var(--ink2);line-height:1.5;padding:10px 12px;background:#EEEDE8;border-radius:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}

@media (max-width:640px){

<body>
<div class="main">
  <div class="bar">
    <div class="row">

      <button class="ibtn on" id="tabMonth" onclick="setTab('month')">월간</button>

      <button class="ibtn" id="calBtn" onclick="toggleMiniCal()" title="날짜 선택">📅</button><button class="ibtn" onclick="openSheet()" title="구글시트 열기">📋</button><button class="ibtn" onclick="cloudLoad(true)" title="구글시트에서 불러오기">⬇</button><button class="ibtn" onclick="cloudSave(true)" title="구글시트에 저장">⬆</button><button class="ibtn" onclick="openSettings()" title="설정 · 클라우드">⚙</button>

    </div>
  </div>
  <div id="viewMonth"></div>
  <div id="viewYear" style="display:none"></div>
</div>

<!-- 일정 편집 -->
<div class="ov" id="ovEvent" onclick="if(event.target===this)closeEvent()">
  <div class="panel">
    <div class="ph"><b id="evTitleH">일정 상세</b><span style="flex-grow:1"></span><button class="ibtn" onclick="closeEvent()">×</button></div>
    <div class="pb">
      <div class="f"><label for="e_title">제목</label><input id="e_title" placeholder="[중국] 상해 Den Tech (10/22-25)"></div>
      <div class="g2c">
        <div class="f"><label for="e_start">시작일</label><input id="e_start" type="date"></div>
        <div class="f"><label for="e_end">종료일</label><input id="e_end" type="date"></div>
      </div>
      <div class="g2c">
        <div class="f"><label for="e_allday">시간</label><select id="e_allday" onchange="toggleTime()"><option value="1">종일</option><option value="0">시간 지정</option></select></div>
        <div class="f" id="timeRow" style="display:none"><label>시작시간 ~ 완료시간</label><div style="display:flex;gap:4px"><input id="e_st" type="time" step="1800"><input id="e_et" type="time" step="1800"></div></div>
      </div>

            <option value="g3meet">G3 회의</option>
            <option value="g2event">G2 행사</option>
            <option value="g3event">G3 행사</option>
            <option value="personal">개인일정</option>
            <option value="holiday">휴일·공휴일</option>
          </select>
          <div class="sidepick"><button type="button" id="sp_g2" onclick="setSide('g2')">G2 중화</button><button type="button" id="sp_g3" onclick="setSide('g3')">G3 미주</button></div></div>
        <div class="f"><label for="e_region">지역</label><input id="e_region" placeholder="중국 · 상해"></div>
      </div>

        </div>
      </div>

  </div>
</div>

<!-- 설정 -->

    </div>
  </div>

  const G3KW=/미국|멕시코|칠레|콜롬비아|캐나다|뉴저지|벤쿠버|시카고|중남미|북미|AAOMS|AAID|AAP|GNYDM|NASM|AMIC|NYU|LASM|ICOI|티후아나/;
  (old.events||[]).forEach(e=>{
    if(e.type)return;
    const tg=e.targets||[];e.vp=tg.includes('VP');
    if(e.status==='holiday'){e.type='holiday';e.vp=false}
    else{const side=(tg.includes('G3')||G3KW.test(e.title))?'g3':'g2';
      e.type=e.status==='milestone'?side+'event':(/미팅|회의|리뷰/.test(e.title)?side+'meet':side+'trip')}
    delete e.status;delete e.targets;
  });
  return old;
}
function load(){
  try{const s=localStorage.getItem(LS_SET);if(s)SET=Object.assign(SET,JSON.parse(s))}catch(e){}
  try{
    let d=localStorage.getItem(LS_KEY);
    if(d){DB=JSON.parse(d)}
    else{
      const o=localStorage.getItem(LS_OLD);
      if(o){DB=migrateOld(JSON.parse(o));toast('기존 데이터를 새 구분 체계로 변환했습니다')}
      else DB={events:JSON.parse(JSON.stringify(SEED)),notes:{},updatedAt:'',seedVer:SEED_VER};
    }
    if(!DB.events)DB.events=[];if(!DB.notes)DB.notes={};
    if(DB.seedVer!==SEED_VER){
      const ids=new Set(DB.events.map(e=>e.id));
      const key=new Set(DB.events.map(e=>e.title+'|'+e.start+'|'+(e.startTime||'')));
      let add=0;
      SEED.forEach(e=>{if(!ids.has(e.id)&&!key.has(e.title+'|'+e.start+'|'+(e.startTime||''))){DB.events.push(JSON.parse(JSON.stringify(e)));add++}});
      DB.events.forEach(e=>{if((e.type==='g2meet'||e.type==='g3meet')&&e.vp)e.vp=false});
      DB.events.forEach(e=>{if(e.start==='2026-09-22'&&e.title.indexOf('\uc11c\uc6b8\uc544\uc0b0')>=0){e.type='personal';e.vp=true;e.title='\uc11c\uc6b8\uc544\uc0b0 (\uac1c\uc778\uc77c\uc815)'}});
      DB.seedVer=SEED_VER;
      try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){}
      if(add)setTimeout(()=>toast('\uc2e0\uaddc \uc77c\uc815 '+add+'\uac74\uc744 \ubd88\ub7ec\uc654\uc2b5\ub2c8\ub2e4'),600);
    }
  }catch(e){DB={events:JSON.parse(JSON.stringify(SEED)),notes:{},updatedAt:''}}
}

function toggleF(k){F[k]=!F[k];renderSide();if(yTab)renderYear();else renderMonth()}
function visible(e){
  if(e.type==='holiday')return true;
  return !!F[e.type];
}
function isHoliday(ds){return DB.events.find(e=>e.type==='holiday'&&e.start<=ds&&e.end>=ds)}
function travelBrief(e){
  const t=e.travel||{};
  const out=[];
  if(t.fromTime)out.push(hhmm(t.fromTime)+(t.toTime?'~'+hhmm(t.toTime):''));
  else if(t.toTime)out.push('\ub3c4 '+hhmm(t.toTime));
  if(t.no)out.push(t.no);
  const tm=[t.terminal,t.terminalTo].filter(Boolean).join('/');
  if(tm)out.push(tm);
  return out.length?' \u00b7 '+out.join(' \u00b7 '):'';
}
function isTravel(e){
  if(e.travel&&(e.travel.no||e.travel.from||e.travel.to||e.travel.mode))return true;
  return /\(\uc774\ub3d9\)|\u2192|\uc774\ub3d9\)/.test(e.title||'');
}

function renderYear(){
  const sel=[];for(let i=1;i<=12;i++)if(yMonths[i])sel.push(i);
  const cnt={};DB.events.forEach(e=>{if(e.start.slice(0,4)!==String(yYear))return;const mm=Number(e.start.slice(5,7));cnt[mm]=(cnt[mm]||0)+1});

  h+='<span style="flex-grow:1"></span><button class="ibtn" onclick="defMonths()">\uc774\ubc88\ub2ec+\ub2e4\uc74c\ub2ec</button><button class="ibtn" onclick="allMonths(true)">\uc804\uccb4</button><button class="ibtn" onclick="allMonths(false)">\ud574\uc81c</button><button class="ibtn" onclick="exportYearImage()">\uc774\ubbf8\uc9c0</button><span class="stepper" style="margin-left:6px"><button onclick="setZoom(-1)" title="\uc791\uac8c">\u2212</button><span class="u" style="border:0;padding:0 6px">\ud06c\uae30</span><button onclick="setZoom(1)" title="\ud06c\uac8c">\uff0b</button></span></div>';
  const auto=(sel.length<=1?3:sel.length<=2?3:sel.length<=4?2:sel.length<=6?1:0);

}
function miniMonth(y,m,n,maxN){
  maxN=maxN||3;
  const first=new Date(y,m-1,1),off=(first.getDay()+6)%7,last=new Date(y,m,0);
  const start=new Date(y,m-1,1-off);
  const nW=Math.ceil((last.getDate()+off)/7);
  const cnt=DB.events.filter(e=>visible(e)&&isYearType(e)&&e.start.slice(0,7)===fmt(first).slice(0,7)).length;
  let h='<div class="ymon"><h4 onclick="jumpMonth('+y+','+m+')">'+m+'\uc6d4<small>'+(cnt?cnt+'\uac74 \u00b7 \ud074\ub9ad\ud558\uba74 \uc6d4\uac04\ubcf4\uae30':'')+'</small></h4>';
  h+='<div class="mdow"><div>\uc6d4</div><div>\ud654</div><div>\uc218</div><div>\ubaa9</div><div>\uae08</div><div class="sa">\ud1a0</div><div class="su">\uc77c</div></div>';
  h+='<div class="mbody">';
  for(let w=0;w<nW;w++){
    const ws=fmt(new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7)),we=addD(ws,6);
    h+='<div class="mwk">';
    for(let i=0;i<7;i++){
      const ds=addD(ws,i),d=pd(ds),out=d.getMonth()!==m-1,hd=isHoliday(ds);
      h+='<div class="md'+(out?' out':'')+(i===5?' sa':i===6?' su':'')+'" style="grid-column:'+(i+1)+';grid-row:1" onclick="jumpDay(\''+ds+'\')">'
       +(ds===TODAY?'<span class="tdy">'+d.getDate()+'</span>':(hd?'<span class="hlc">'+d.getDate()+'</span>':d.getDate()))+'</div>';
    }
    const evs=DB.events.filter(e=>visible(e)&&isYearType(e)&&e.start<=we&&e.end>=ws)
      .sort((a,b)=>PRI[a.type]-PRI[b.type]||(a.start<b.start?-1:a.start>b.start?1:(b.end>a.end?1:-1)));
    const lanes=[];let shown=0,extra=0;
    evs.forEach(e=>{
      const s0=e.start<ws?0:(pd(e.start).getDay()+6)%7, e0=e.end>we?6:(pd(e.end).getDay()+6)%7;
      let li=lanes.findIndex(l=>l.every(r=>e0<r.s||s0>r.e));
      if(li<0){lanes.push([]);li=lanes.length-1}
      lanes[li].push({s:s0,e:e0});
      if(li>=maxN){extra++;return}
      shown++;
      h+='<div class="yev '+e.type+'" style="grid-column:'+(s0+1)+'/'+(e0+2)+';grid-row:'+(li+2)+'" onclick="event.stopPropagation();openEvent(\''+e.id+'\')" title="'+esc(e.title)+'">'+esc(e.title)+'</div>';
    });
    if(extra)h+='<div class="ymore" style="grid-column:1/8;grid-row:'+(maxN+2)+'">+'+extra+'\uac74</div>';
    h+='</div>';
  }
  return h+'</div></div>';
}
function isYearType(e){return e.type==='g2trip'||e.type==='g3trip'||e.type==='g2event'||e.type==='g3event'}
function barColor(t){const c={g2trip:'var(--g2t)',g2meet:'var(--g2m)',g2event:'var(--g2eTx)',g3trip:'var(--g3t)',g3meet:'var(--g3m)',g3event:'var(--g3eTx)',personal:'var(--pers)'};return c[t]||'var(--hol)'}
const FKEY=[['g2trip','G2 \ucd9c\uc7a5','var(--g2t)'],['g3trip','G3 \ucd9c\uc7a5','var(--g3t)'],
  ['g2meet','G2 \ud68c\uc758','var(--g2m)'],['g3meet','G3 \ud68c\uc758','var(--g3m)'],
  ['g2event','G2 \ud589\uc0ac','var(--g2eBg)'],['g3event','G3 \ud589\uc0ac','var(--g3eBg)'],['personal','\uac1c\uc778\uc77c\uc815','var(--pers)']];
function toggleMiniCal(){const m=document.getElementById('miniCal');const show=(m.style.display==='none');m.style.display=show?'':'none';if(show)renderSide()}

  if(m.contains(ev.target)||(ev.target.closest&&ev.target.closest('#calBtn')))return;

function renderSide(){
  const y=cur.getFullYear(),m=cur.getMonth();
  const first=new Date(y,m,1),off=(first.getDay()+6)%7,last=new Date(y,m+1,0);
  const start=new Date(y,m,1-off),n=Math.ceil((last.getDate()+off)/7)*7;
  let h='<div class="mh"><b>'+y+'\ub144 '+(m+1)+'\uc6d4</b><button onclick="moveMonth(-1)">&lt;</button><button onclick="moveMonth(1)">&gt;</button></div><div class="mg">';
  ['\uc6d4','\ud654','\uc218','\ubaa9','\uae08','\ud1a0','\uc77c'].forEach((w,i)=>{h+='<div class="w'+(i===5?' sa':i===6?' su':'')+'">'+w+'</div>'});
  for(let i=0;i<n;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),ds=fmt(d);
    const out=d.getMonth()!==m, dw=i%7, hd=isHoliday(ds);
    const has=DB.events.some(e=>visible(e)&&e.type!=='holiday'&&e.start<=ds&&e.end>=ds);
    const sel=(selWeek&&ds>=selWeek&&ds<=addD(selWeek,6));
    let cls='c'+(out?' out':'')+(dw===5?' sa':dw===6?' su':'');
    if(ds===TODAY)cls+=' today';else if(hd)cls+=' hol';else if(sel&&selDay===ds)cls+=' sel';
    h+='<div class="'+cls+'" onclick="jumpDay(\''+ds+'\')" title="'+(hd?esc(hd.title):'')+'">'+d.getDate()+(has?'<span class="dot"></span>':'')+'</div>';
  }
  h+='</div>';
  const mc=document.getElementById('miniCal');if(mc)mc.innerHTML=h;
  let f='';
  FKEY.forEach(k=>{
    const cnt=DB.events.filter(e=>e.type===k[0]).length;
    f+='<button class="'+(F[k[0]]?'on':'')+'" onclick="toggleF(\''+k[0]+'\')"><i style="background:'+k[2]+(k[0].indexOf('event')>0?';border-left:3px solid '+(k[0][1]==='2'?'var(--g2eTx)':'var(--g3eTx)'):'')+'"></i>'+k[1]+'</button>';
  });
  const sf=document.getElementById('sideFilter');if(sf)sf.innerHTML=f;
}
function render(){
  document.getElementById('mTitle').textContent=cur.getFullYear()+'년 '+(cur.getMonth()+1)+'월';
  renderMonth();renderSide();
  hdrStat();
}
function renderMonth(){
  const y=cur.getFullYear(),m=cur.getMonth();
  const first=new Date(y,m,1),off=(first.getDay()+6)%7,start=new Date(y,m,1-off);
  const last=new Date(y,m+1,0);const nWeeks=Math.ceil((last.getDate()+off)/7);
  const allWs=[];for(let w=0;w<nWeeks;w++)allWs.push(fmt(new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7)));
  const focus=wkOpen&&selWeek&&allWs.includes(selWeek);
  let h='<div class="month"><div class="dow"><div></div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div><div class="sun">일</div></div>';
  for(let w=0;w<nWeeks;w++){
    const ws=allWs[w],we=addD(ws,6);
    const sel=(selWeek===ws)&&wkOpen;
    if(focus&&!sel)continue;
    h+='<div class="week'+(sel?' sel':'')+'">';
    h+='<div class="wbtn'+(sel?' on':'')+'" style="grid-column:1;grid-row:1" onclick="openWeek(\''+ws+'\')" title="\uc774 \uc8fc\uc758 \uc8fc\uac04\uc77c\uc815 \ubcf4\uae30">\uc8fc\uac04</div>';
    for(let i=0;i<7;i++){const ds=addD(ws,i),d=pd(ds);const out=d.getMonth()!==m;
      const hd=isHoliday(ds);h+='<div class="d'+(out?' out':'')+(i===5?' sat':i===6?' sun':'')+'" style="grid-column:'+(i+2)+';grid-row:1;cursor:pointer" title="'+(hd?esc(hd.title):'\ud074\ub9ad: \uc774 \ub0a0\uc9dc \uc120\ud0dd')+'" onclick="pickDay(\''+ds+'\')">'+(ds===TODAY?'<span class="today">'+d.getDate()+'</span>':(hd?'<span class="holc">'+d.getDate()+'</span>':(d.getDate()===1?(d.getMonth()+1)+'/1':d.getDate())))+'<span class="add" onclick="event.stopPropagation();openEvent(null,\''+ds+'\')">+</span></div>';
    }
    // 줄 순서: 출장 → 회의 → 행사 → 휴일
    const isEvt=e=>e.type==='g2event'||e.type==='g3event';
    const evtList=DB.events.filter(e=>visible(e)&&isEvt(e)&&e.start<=we&&e.end>=ws)
      .sort((a,b)=>(a.start<b.start?-1:a.start>b.start?1:(b.end>a.end?1:-1)));
    const evs=DB.events.filter(e=>visible(e)&&e.type!=='holiday'&&!isEvt(e)&&e.start<=we&&e.end>=ws)
      .sort((a,b)=>PRI[a.type]-PRI[b.type]||(a.start<b.start?-1:a.start>b.start?1:(b.end>a.end?1:-1)));
    let base=0,curPri=-1,lanes=[],secStart=0,secName='';let over={};
    const secs=[];
    const MAXL=name=>name==='\ud589\uc0ac'?2:4;
    function closeSec(){
      if(!secName)return;
      const used=Math.min(lanes.length,MAXL(secName));
      const keys=Object.keys(over);
      keys.forEach(c=>{h+='<div class="emore" style="grid-column:'+(Number(c)+2)+';grid-row:'+(base+used+2)+'" onclick="event.stopPropagation();openWeek(\''+ws+'\')" title="\ub354 \ubcf4\uae30">+'+over[c]+'</div>'});
      const addRow=keys.length?1:0;
      secs.push({name:secName,from:secStart,to:base+used+addRow});
      base+=used+addRow;
      lanes=[];over={};
    }
    evs.forEach(e=>{
      if(PRI[e.type]!==curPri){
        if(secName){closeSec();h+='<div class="sdiv" style="grid-column:1/-1;grid-row:'+(base+2)+'"></div>';base+=1;}
        curPri=PRI[e.type];secStart=base;secName=SECT[e.type]||'';
      }
      const s0=e.start<ws?0:(pd(e.start).getDay()+6)%7,en=e.end>we?6:(pd(e.end).getDay()+6)%7;
      let li=lanes.findIndex(l=>l.every(r=>en<r.s||s0>r.e));if(li<0){lanes.push([]);li=lanes.length-1}lanes[li].push({s:s0,e:en});
      if(li>=MAXL(secName)){for(let c=s0;c<=en;c++)over[c]=(over[c]||0)+1;return}
      h+='<div class="ev '+e.type+'" style="grid-column:'+(s0+2)+'/'+(en+3)+';grid-row:'+(base+li+2)+'" onclick="event.stopPropagation();openEvent(\''+e.id+'\')" title="'+esc(TYPE_NAME[e.type]+' \u00b7 '+e.title)+'">'+(isTravel(e)?'<span class="m">\u2708</span>':'')+(e.allDay===false&&e.startTime?'<span class="m">'+hhmm(e.startTime)+'</span>':'')+esc(e.title)+(isTravel(e)?'<span class="tinfo">'+esc(travelBrief(e))+'</span>':'')+'</div>';
    });
    closeSec();
    // \ud589\uc0ac: \ud55c \uc904\ub85c \ubcd1\ud569 \ud45c\uc2dc
    if(evtList.length){
      h+='<div class="sdiv" style="grid-column:1/-1;grid-row:'+(base+2)+'"></div>';base+=1;
      const perDay=[];
      for(let i=0;i<7;i++){const ds=addD(ws,i);perDay.push(evtList.filter(e=>e.start<=ds&&e.end>=ds))}
      let i=0;
      while(i<7){
        if(!perDay[i].length){i++;continue}
        const sig=perDay[i].map(e=>e.id).join(',');
        let j=i;
        while(j+1<7&&perDay[j+1].map(e=>e.id).join(',')===sig)j++;
        const list=perDay[i],first=list[0];
        const label=list.length===1?first.title:('\ud589\uc0ac '+list.length+'\uac74 \u00b7 '+first.title);
        h+='<div class="ev '+first.type+(list.length>1?' multi':'')+'" style="grid-column:'+(i+2)+'/'+(j+3)+';grid-row:'+(base+2)+'" onclick="event.stopPropagation();'+(list.length===1?'openEvent(\''+first.id+'\')':'openWeek(\''+ws+'\')')+'" title="'+esc(list.map(e=>e.title).join('\n'))+'">'+esc(label)+'</div>';
        i=j+1;
      }
      secs.push({name:'\ud589\uc0ac',from:base,to:base+1});
      base+=1;
    }

function shrink(file,maxW){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{
        const sc=Math.min(1,maxW/im.width);
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.8));
      };
      im.onerror=rej;im.src=fr.result;
    };
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

function nthDow(ds){const d=pd(ds);return Math.floor((d.getDate()-1)/7)+1}
function buildRepeat(base,freq,until){
  const out=[],lim=pd(until),span=(pd(base.end)-pd(base.start))/86400000;
  let guard=0;
  if(freq==='weekly'||freq==='biweekly'){
    const step=(freq==='weekly'?7:14);
    let cur2=addD(base.start,step);
    while(pd(cur2)<=lim&&guard++<400){out.push(cur2);cur2=addD(cur2,step)}
  }else if(freq==='mdate'){
    const day=Number(base.start.slice(8));let d=pd(base.start);
    while(guard++<60){d=new Date(d.getFullYear(),d.getMonth()+1,1);
      const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      const dd=new Date(d.getFullYear(),d.getMonth(),Math.min(day,last));
      if(dd>lim)break;out.push(fmt(dd));}
  }else if(freq==='mdow'){
    const n=nthDow(base.start),dow=pd(base.start).getDay();let d=pd(base.start);
    while(guard++<60){d=new Date(d.getFullYear(),d.getMonth()+1,1);
      let c=0,found=null;
      for(let i=1;i<=31;i++){const x=new Date(d.getFullYear(),d.getMonth(),i);
        if(x.getMonth()!==d.getMonth())break;
        if(x.getDay()===dow){c++;if(c===n){found=x;break}}}
      if(!found)continue;if(found>lim)break;out.push(fmt(found));
    }
  }
  return out.map(st=>Object.assign(JSON.parse(JSON.stringify(base)),{id:uid(),start:st,end:addD(st,span)}));
}
function saveEvent(){
  const title=g('e_title').trim();if(!title){toast('제목을 입력하세요');return}
  let s=g('e_start'),en=g('e_end')||s;if(!s){toast('시작일을 입력하세요');return}if(en<s)en=s;
  const obj={id:editing?editing.id:uid(),title,start:s,end:en,allDay:g('e_allday')==='1',startTime:g('e_st'),endTime:g('e_et'),type:g('e_type'),vp:(g('e_type')==='g2meet'||g('e_type')==='g3meet')?false:true,region:g('e_region').trim(),memo:g('e_memo'),travel:collectTravel(),attachments:editAtt};
  const freq=g('e_rep'),until=g('e_until');
  if(editing)Object.assign(editing,obj);else DB.events.push(obj);
  let made=0;
  if(freq!=='none'){
    if(!until){toast('반복 종료일을 입력하세요');return}
    obj.series=obj.series||obj.id;
    const list=buildRepeat(obj,freq,until);
    list.forEach(x=>{x.series=obj.series});
    DB.events.push(...list);made=list.length;
  }
  persist();closeEvent();render();toast(made?'저장됨 · 반복 '+made+'건 생성':'저장됨');
}

      .map(a=>({name:a.name,url:a.url,fileId:a.fileId||''}));

async function cloudSave(manual){
  if(!SET.gasUrl){if(manual){toast('먼저 ⚙ 설정에서 구글시트를 연결하세요');openSettings()}return;}
  if(!manual&&!loadedOk){hdrStat('');return}   // 시트를 아직 못 읽었으면 자동저장 보류
  if(!DB.events.length&&!manual){hdrStat('빈 데이터 → 저장 생략');return}
  // 대량 삭제 방지: 시트가 현재 기기보다 20건 이상 많으면 확인
  try{
    const chk=await gas({action:'ping'});
    if(chk&&chk.ok&&chk.rows>DB.events.length+20){
      const go=confirm('구글시트에는 '+chk.rows+'건이 있는데 이 기기에는 '+DB.events.length+'건뿐입니다.\n\n그대로 저장하면 시트의 '+(chk.rows-DB.events.length)+'건이 사라집니다.\n\n[취소] 를 누르고 ⬇ 불러오기를 먼저 하세요.\n\n계속 저장할까요?');
      if(!go){hdrStat('');toast('저장을 취소했습니다 · ⬇ 로 먼저 불러오세요');return}
    }
  }catch(e){}
  hdrStat('📋 시트 저장 중…');
  try{const r=await gas({action:'save',data:sheetSafe(DB)});keepSheetUrl(r);if(r&&r.blocked){hdrStat('');toast('시트 보호: '+(r.msg||'대량 삭제 차단'));if(manual)slog(r.msg||'');return}if(r.ok){hdrStat();if(manual){slog('저장 완료');toast('구글시트에 저장했습니다')}}else{hdrStat('📋 시트 저장 실패');slog('저장 실패: '+(r.error||''))}}catch(e){hdrStat('📋 시트 저장 실패');if(manual)slog('저장 실패: '+e.message)}
}
async function cloudLoad(manual){
  if(!SET.gasUrl){if(manual){toast('먼저 ⚙ 설정에서 구글시트를 연결하세요');openSettings()}return;}

  }else{if(r.ok)loadedOk=true;if(manual)slog(r.ok?'클라우드에 데이터가 없습니다':'실패: '+(r.error||''))}}catch(e){if(manual)slog('불러오기 실패: '+e.message)}

function calDesc(e){const t=e.travel||{};const L=[];L.push('유형: '+TYPE_NAME[e.type]+(e.vp?' · 정부사장님 참석':''));if(e.region)L.push('지역: '+e.region);if(isTravel(e))L.push('이동: '+[t.mode,t.no,(t.from&&t.to)?t.from+' → '+t.to:'',t.fromTime?'출발 '+hhmm(t.fromTime):'',t.toTime?'도착 '+hhmm(t.toTime):'',t.terminal?'터미널 '+t.terminal:'',''].filter(Boolean).join(' · '));(e.attachments||[]).forEach(a=>L.push('첨부: '+a.name+' '+a.url));if(e.memo)L.push('주요 내용: '+e.memo);return L.join('\n')}
async function pushCalendar(){
  if(!SET.gasUrl){slog('Apps Script 연결이 필요합니다');return}
  const y=cur.getFullYear(),m=cur.getMonth();const ms=fmt(new Date(y,m,1)),me=fmt(new Date(y,m+1,0));

  if(!confirm(evs.length+'건을 구글캘린더(기본 캘린더)에 등록/갱신할까요?'))return;

}
function exportICS(){
  const y=cur.getFullYear(),m=cur.getMonth();const ms=fmt(new Date(y,m,1)),me=fmt(new Date(y,m+1,0));
  const evs=DB.events.filter(e=>visible(e)&&e.start<=me&&e.end>=ms);
  const d8=s=>s.replace(/-/g,'');const esc2=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MegaGen G2G3//KO\r\n';
  evs.forEach(e=>{ics+='BEGIN:VEVENT\r\nUID:'+e.id+'@g2g3\r\nSUMMARY:'+esc2(e.title)+'\r\n';
    if(e.allDay===false&&e.startTime){ics+='DTSTART:'+d8(e.start)+'T'+e.startTime.replace(':','')+'00\r\nDTEND:'+d8(e.end)+'T'+(e.endTime||e.startTime).replace(':','')+'00\r\n'}else{ics+='DTSTART;VALUE=DATE:'+d8(e.start)+'\r\nDTEND;VALUE=DATE:'+d8(addD(e.end,1))+'\r\n'}
    ics+='DESCRIPTION:'+esc2(calDesc(e))+'\r\nEND:VEVENT\r\n'});
  ics+='END:VCALENDAR\r\n';
  dl(new Blob([ics],{type:'text/calendar'}),'G2G3_'+y+'-'+String(m+1).padStart(2,'0')+'.ics');
}
